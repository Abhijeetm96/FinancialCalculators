<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recurring Deposit (RD) Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .tenure-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .tenure-input-group input[type="number"] {
            flex-grow: 2;
        }
        .tenure-input-group select {
            flex-grow: 1;
        }
        button {
            background-color: #17a2b8; /* Teal color for RD */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s ease;
            font-weight: bold;
        }
        button:hover {
            background-color: #138496;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-size: 17px;
            color: #333;
        }
        #result p {
            margin: 8px 0;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recurring Deposit (RD) Calculator</h1>

        <div class="input-group">
            <label for="monthlyInvestment">Monthly Investment Amount (M)</label>
            <input type="number" id="monthlyInvestment" placeholder="Enter monthly investment">
            <div class="error" id="investmentError"></div>
        </div>

        <div class="input-group">
            <label for="annualInterestRate">Annual Interest Rate (R) %</label>
            <input type="number" id="annualInterestRate" placeholder="Enter annual interest rate">
            <div class="error" id="rateError"></div>
        </div>

        <div class="input-group">
            <label for="tenureValue">Tenure (T)</label>
            <div class="tenure-input-group">
                <input type="number" id="tenureValue" placeholder="Enter tenure duration">
                <select id="tenureUnit">
                    <option value="years">Years</option>
                    <option value="months">Months</option>
                </select>
            </div>
            <div class="error" id="tenureError"></div>
        </div>

        <button onclick="calculateRD()">Calculate Maturity</button>

        <div id="result" style="display: none;">
            <p>Total Principal Invested: <strong id="totalPrincipalValue"></strong></p>
            <p>Total Interest Earned: <strong id="totalInterestValue"></strong></p>
            <p style="font-weight: bold; font-size: 1.1em;">Maturity Amount (A): <strong id="maturityAmountValue"></strong></p>
        </div>
    </div>

    <script>
        function validateNumericInput(value, fieldName, errorElementId, allowZero = false) {
            const errorElement = document.getElementById(errorElementId);
            const check = allowZero ? (isNaN(value) || value < 0) : (isNaN(value) || value <= 0);
            if (check) {
                errorElement.textContent = fieldName + (allowZero ? ' must be a non-negative number.' : ' must be a positive number.');
                return false;
            }
            errorElement.textContent = '';
            return true;
        }

        function calculateRD() {
            const monthlyInvestmentInput = document.getElementById('monthlyInvestment');
            const annualRateInput = document.getElementById('annualInterestRate');
            const tenureValueInput = document.getElementById('tenureValue');
            const tenureUnitInput = document.getElementById('tenureUnit');
            const resultDiv = document.getElementById('result');

            // Clear previous errors
            document.getElementById('investmentError').textContent = '';
            document.getElementById('rateError').textContent = '';
            document.getElementById('tenureError').textContent = '';

            const M = parseFloat(monthlyInvestmentInput.value);
            const R_annual_percent = parseFloat(annualRateInput.value);
            const T_value = parseFloat(tenureValueInput.value);
            const T_unit = tenureUnitInput.value;

            let isValid = true;
            isValid &= validateNumericInput(M, 'Monthly Investment', 'investmentError');
            isValid &= validateNumericInput(R_annual_percent, 'Annual Interest Rate', 'rateError', true); // Rate can be 0
            isValid &= validateNumericInput(T_value, 'Tenure', 'tenureError');

            if (!isValid) {
                resultDiv.style.display = 'none';
                return;
            }

            let totalMonths;
            if (T_unit === 'years') {
                totalMonths = T_value * 12;
            } else { // months
                totalMonths = T_value;
            }

            // RD Calculation (Iterative method for quarterly compounding)
            let balance = 0;
            const quarterlyInterestRate = (R_annual_percent / 100) / 4; // Decimal quarterly rate

            for (let month = 1; month <= totalMonths; month++) {
                balance += M; // Add monthly deposit
                // If it's the end of a quarter, calculate and add interest
                if (month % 3 === 0) {
                    const interestThisQuarter = balance * quarterlyInterestRate;
                    balance += interestThisQuarter;
                }
            }

            const maturityAmount = balance;
            const totalPrincipalInvested = M * totalMonths;
            const totalInterestEarned = maturityAmount - totalPrincipalInvested;

            if (isNaN(maturityAmount) || !isFinite(maturityAmount)) {
                document.getElementById('maturityAmountValue').textContent = 'N/A';
                document.getElementById('totalPrincipalValue').textContent = 'N/A';
                document.getElementById('totalInterestValue').textContent = 'N/A (Please check inputs)';
            } else {
                document.getElementById('maturityAmountValue').textContent = '₹ ' + maturityAmount.toFixed(2);
                document.getElementById('totalPrincipalValue').textContent = '₹ ' + totalPrincipalInvested.toFixed(2);
                document.getElementById('totalInterestValue').textContent = '₹ ' + totalInterestEarned.toFixed(2);
            }

            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
