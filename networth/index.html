<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Worth Calculator</title>
    <link rel="stylesheet" href="../styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="container">
        <div class="calculator-container">
            <header class="calculator-header">
                <h1>Net Worth Calculator</h1>
                <p>Track and analyze your complete financial portfolio</p>
            </header>

            <div class="calculator-content">
                <!-- Liquid Assets Section -->
                <section class="section">
                    <div class="section-header">
                        <i class="fas fa-money-bill-wave"></i>
                        <h2>Liquid Assets</h2>
                    </div>
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="cash">Cash</label>
                            <div class="input-wrapper">
                                <i class="fas fa-wallet"></i>
                                <input type="number" id="cash" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="bankDeposits">Bank Deposits</label>
                            <div class="input-wrapper">
                                <i class="fas fa-university"></i>
                                <input type="number" id="bankDeposits" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="moneyMarket">Money Market Funds</label>
                            <div class="input-wrapper">
                                <i class="fas fa-piggy-bank"></i>
                                <input type="number" id="moneyMarket" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="cds">Certificates of Deposit (CDs)</label>
                            <div class="input-wrapper">
                                <i class="fas fa-certificate"></i>
                                <input type="number" id="cds" class="input-field" placeholder="0">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Investment Assets Section -->
                <section class="section">
                    <div class="section-header">
                        <i class="fas fa-chart-line"></i>
                        <h2>Investment Assets</h2>
                    </div>
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="stocks">Stocks</label>
                            <div class="input-wrapper">
                                <i class="fas fa-arrow-trend-up"></i>
                                <input type="number" id="stocks" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="bonds">Bonds</label>
                            <div class="input-wrapper">
                                <i class="fas fa-file-contract"></i>
                                <input type="number" id="bonds" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="mutualFunds">Mutual Funds</label>
                            <div class="input-wrapper">
                                <i class="fas fa-users"></i>
                                <input type="number" id="mutualFunds" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="etfs">ETFs</label>
                            <div class="input-wrapper">
                                <i class="fas fa-exchange-alt"></i>
                                <input type="number" id="etfs" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="retirement">Retirement Accounts</label>
                            <div class="input-wrapper">
                                <i class="fas fa-shield-alt"></i>
                                <input type="number" id="retirement" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="crypto">Cryptocurrencies</label>
                            <div class="input-wrapper">
                                <i class="fab fa-bitcoin"></i>
                                <input type="number" id="crypto" class="input-field" placeholder="0">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Real Estate Section -->
                <section class="section">
                    <div class="section-header">
                        <i class="fas fa-home"></i>
                        <h2>Real Estate</h2>
                    </div>
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="primaryResidence">Primary Residence</label>
                            <div class="input-wrapper">
                                <i class="fas fa-house-user"></i>
                                <input type="number" id="primaryResidence" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="vacationHomes">Vacation Homes</label>
                            <div class="input-wrapper">
                                <i class="fas fa-umbrella-beach"></i>
                                <input type="number" id="vacationHomes" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="rentalProperties">Rental Properties</label>
                            <div class="input-wrapper">
                                <i class="fas fa-building"></i>
                                <input type="number" id="rentalProperties" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="land">Land</label>
                            <div class="input-wrapper">
                                <i class="fas fa-mountain"></i>
                                <input type="number" id="land" class="input-field" placeholder="0">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Personal Property Section -->
                <section class="section">
                    <div class="section-header">
                        <i class="fas fa-gem"></i>
                        <h2>Personal Property</h2>
                    </div>
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="vehicles">Vehicles</label>
                            <div class="input-wrapper">
                                <i class="fas fa-car"></i>
                                <input type="number" id="vehicles" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="jewelry">Jewelry</label>
                            <div class="input-wrapper">
                                <i class="fas fa-ring"></i>
                                <input type="number" id="jewelry" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="art">Art & Collectibles</label>
                            <div class="input-wrapper">
                                <i class="fas fa-palette"></i>
                                <input type="number" id="art" class="input-field" placeholder="0">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Liabilities Section -->
                <section class="section">
                    <div class="section-header">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Liabilities</h2>
                    </div>
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="mortgages">Mortgages</label>
                            <div class="input-wrapper">
                                <i class="fas fa-house-damage"></i>
                                <input type="number" id="mortgages" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="creditCards">Credit Card Debt</label>
                            <div class="input-wrapper">
                                <i class="fas fa-credit-card"></i>
                                <input type="number" id="creditCards" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="studentLoans">Student Loans</label>
                            <div class="input-wrapper">
                                <i class="fas fa-graduation-cap"></i>
                                <input type="number" id="studentLoans" class="input-field" placeholder="0">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="autoLoans">Auto Loans</label>
                            <div class="input-wrapper">
                                <i class="fas fa-car-side"></i>
                                <input type="number" id="autoLoans" class="input-field" placeholder="0">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Results Section -->
                <div class="results-grid">
                    <div class="result-card">
                        <h3><i class="fas fa-plus-circle"></i> Total Assets</h3>
                        <p id="totalAssets" class="result-value positive">₹0</p>
                    </div>
                    <div class="result-card">
                        <h3><i class="fas fa-minus-circle"></i> Total Liabilities</h3>
                        <p id="totalLiabilities" class="result-value negative">₹0</p>
                    </div>
                    <div class="result-card">
                        <h3><i class="fas fa-equals"></i> Net Worth</h3>
                        <p id="netWorth" class="result-value">₹0</p>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="charts-grid">
                    <div class="chart-container">
                        <canvas id="assetDistributionChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <canvas id="netWorthTrendChart"></canvas>
                    </div>
                </div>

                <!-- Detailed Breakdown -->
                <div class="breakdown-table">
                    <div class="table-header">
                        <h2><i class="fas fa-table"></i> Detailed Breakdown</h2>
                    </div>
                    <table id="breakdownTable">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th class="amount-cell">Amount</th>
                                <th class="amount-cell">% of Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dynamically populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize state variables
        let assetDistributionChart = null;
        let netWorthTrendChart = null;
        let calculationTimeout = null;

        // Asset categories mapping
        const categories = {
            assets: {
                'Liquid Assets': ['cash', 'bankDeposits', 'moneyMarket', 'cds'],
                'Investment Assets': ['stocks', 'bonds', 'mutualFunds', 'etfs', 'retirement', 'crypto'],
                'Real Estate': ['primaryResidence', 'vacationHomes', 'rentalProperties', 'land'],
                'Personal Property': ['vehicles', 'jewelry', 'art']
            },
            liabilities: {
                'Short-term Liabilities': ['creditCards'],
                'Long-term Liabilities': ['mortgages', 'studentLoans', 'autoLoans']
            }
        };

        // Custom color palettes
        const colorPalettes = {
            assets: [
                'rgba(61, 165, 156, 0.8)',   // Primary teal
                'rgba(79, 190, 180, 0.8)',   // Light teal
                'rgba(45, 122, 115, 0.8)',   // Dark teal
                'rgba(92, 219, 208, 0.8)',   // Bright teal
                'rgba(38, 198, 218, 0.8)',   // Cyan
                'rgba(0, 150, 136, 0.8)'     // Material teal
            ],
            liabilities: [
                'rgba(220, 53, 69, 0.8)',    // Red
                'rgba(255, 87, 34, 0.8)',    // Deep Orange
                'rgba(255, 152, 0, 0.8)',    // Orange
                'rgba(255, 193, 7, 0.8)'     // Amber
            ]
        };

        // Format currency for Indian Rupees
        function formatCurrency(value) {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                maximumFractionDigits: 0
            }).format(value);
        }

        // Get value from input
        function getInputValue(id) {
            return parseFloat(document.getElementById(id)?.value || 0) || 0;
        }

        // Calculate totals by category
        function calculateTotals() {
            const totals = {
                assetsByCategory: {},
                liabilitiesByCategory: {},
                totalAssets: 0,
                totalLiabilities: 0,
                timestamp: new Date().toISOString()
            };

            // Calculate assets
            Object.entries(categories.assets).forEach(([category, ids]) => {
                totals.assetsByCategory[category] = ids.reduce((sum, id) => {
                    const value = getInputValue(id);
                    totals.totalAssets += value;
                    return sum + value;
                }, 0);
            });

            // Calculate liabilities
            Object.entries(categories.liabilities).forEach(([category, ids]) => {
                totals.liabilitiesByCategory[category] = ids.reduce((sum, id) => {
                    const value = getInputValue(id);
                    totals.totalLiabilities += value;
                    return sum + value;
                }, 0);
            });

            return totals;
        }

        // Animate value changes
        function animateValue(elementId, targetValue) {
            const element = document.getElementById(elementId);
            const startValue = parseFloat(element.textContent.replace(/[^0-9.-]+/g, "")) || 0;
            const duration = 1000;
            const steps = 60;
            const increment = (targetValue - startValue) / steps;
            let currentValue = startValue;
            let currentStep = 0;

            function animate() {
                currentStep++;
                currentValue += increment;
                element.textContent = formatCurrency(Math.round(currentValue));

                if (currentStep < steps) {
                    requestAnimationFrame(animate);
                } else {
                    element.textContent = formatCurrency(Math.round(targetValue));
                }
            }

            requestAnimationFrame(animate);
        }

        // Update results display with animation
        function updateResults(totals) {
            const netWorth = totals.totalAssets - totals.totalLiabilities;

            animateValue('totalAssets', totals.totalAssets);
            animateValue('totalLiabilities', totals.totalLiabilities);
            animateValue('netWorth', netWorth);

            const netWorthElement = document.getElementById('netWorth');
            netWorthElement.className = `result-value ${netWorth >= 0 ? 'positive' : 'negative'}`;
        }

        // Get responsive chart options based on screen size
        function getResponsiveChartOptions() {
            const isMobile = window.innerWidth <= 768;
            const isSmallMobile = window.innerWidth <= 480;

            return {
                fontSize: isSmallMobile ? 10 : (isMobile ? 12 : 14),
                padding: isSmallMobile ? 10 : (isMobile ? 15 : 20),
                legendPosition: isMobile ? 'bottom' : 'right'
            };
        }

        // Update asset distribution chart
        function updateAssetDistributionChart(totals) {
            const ctx = document.getElementById('assetDistributionChart').getContext('2d');
            const responsive = getResponsiveChartOptions();

            if (assetDistributionChart) {
                assetDistributionChart.destroy();
            }

            const datasets = [];
            const labels = [];
            const data = [];
            const colors = [];
            let assetColorIndex = 0;
            let liabilityColorIndex = 0;

            // Add assets
            Object.entries(totals.assetsByCategory).forEach(([category, value]) => {
                if (value > 0) {
                    labels.push(category);
                    data.push(value);
                    colors.push(colorPalettes.assets[assetColorIndex % colorPalettes.assets.length]);
                    assetColorIndex++;
                }
            });

            // Add liabilities
            Object.entries(totals.liabilitiesByCategory).forEach(([category, value]) => {
                if (value > 0) {
                    labels.push(category);
                    data.push(-value); // Represent liabilities as negative for potential combined chart
                    colors.push(colorPalettes.liabilities[liabilityColorIndex % colorPalettes.liabilities.length]);
                    liabilityColorIndex++;
                }
            });

            assetDistributionChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data.map(Math.abs), // Use absolute values for doughnut chart
                        backgroundColor: colors,
                        borderColor: colors.map(color => color.replace('0.8', '1')),
                        borderWidth: 2,
                        hoverOffset: 15
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        title: {
                            display: true,
                            text: 'Asset & Liability Distribution',
                            color: '#333',
                            font: {
                                size: responsive.fontSize + 2,
                                weight: 'bold',
                                family: 'Inter'
                            },
                            padding: responsive.padding
                        },
                        legend: {
                            position: responsive.legendPosition,
                            labels: {
                                font: {
                                    size: responsive.fontSize,
                                    family: 'Inter'
                                },
                                padding: responsive.padding,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    const value = Math.abs(context.raw);
                                    const totalPositive = data.filter(d => d > 0).reduce((a,b) => a + b, 0);
                                    const totalNegative = Math.abs(data.filter(d => d < 0).reduce((a,b) => a + b, 0));
                                    const overallTotal = totalPositive + totalNegative; // Sum of absolute values for percentage
                                    const percentage = ((value / overallTotal) * 100).toFixed(1);
                                    return `${context.label}: ${formatCurrency(value)} (${percentage}%)`;
                                }
                            },
                            padding: responsive.padding,
                            titleFont: {
                                size: responsive.fontSize + 2,
                                family: 'Inter'
                            },
                            bodyFont: {
                                size: responsive.fontSize,
                                family: 'Inter'
                            }
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1000,
                        easing: 'easeInOutQuart'
                    }
                }
            });
        }

        // Update net worth trend chart
        function updateNetWorthTrendChart(totals) {
            const ctx = document.getElementById('netWorthTrendChart').getContext('2d');
            const responsive = getResponsiveChartOptions();

            if (netWorthTrendChart) {
                netWorthTrendChart.destroy();
            }

            netWorthTrendChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Current Position'],
                    datasets: [
                        {
                            label: 'Total Assets',
                            data: [totals.totalAssets],
                            backgroundColor: 'rgba(61, 165, 156, 0.8)',
                            borderColor: '#3da59c',
                            borderWidth: 2,
                            borderRadius: 8,
                            barPercentage: 0.6
                        },
                        {
                            label: 'Total Liabilities',
                            data: [totals.totalLiabilities],
                            backgroundColor: 'rgba(220, 53, 69, 0.8)',
                            borderColor: '#dc3545',
                            borderWidth: 2,
                            borderRadius: 8,
                            barPercentage: 0.6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0,0,0,0.05)',
                                lineWidth: 1
                            },
                            ticks: {
                                callback: value => formatCurrency(value),
                                font: {
                                    size: responsive.fontSize,
                                    family: 'Inter'
                                }
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: responsive.fontSize,
                                    family: 'Inter'
                                }
                            }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Assets vs Liabilities',
                            color: '#333',
                            font: {
                                size: responsive.fontSize + 2,
                                weight: 'bold',
                                family: 'Inter'
                            },
                            padding: responsive.padding
                        },
                        legend: {
                            position: responsive.legendPosition,
                            labels: {
                                font: {
                                    size: responsive.fontSize,
                                    family: 'Inter'
                                },
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            padding: responsive.padding,
                            titleFont: {
                                size: responsive.fontSize + 2,
                                family: 'Inter'
                            },
                            bodyFont: {
                                size: responsive.fontSize,
                                family: 'Inter'
                            },
                            callbacks: {
                                label: function (context) {
                                    return `${context.dataset.label}: ${formatCurrency(context.raw)}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Update breakdown table
        function updateBreakdownTable(totals) {
            const tbody = document.querySelector('#breakdownTable tbody');
            tbody.innerHTML = '';

            const grandTotal = totals.totalAssets + totals.totalLiabilities; // For percentage calculation

            // Add assets
            Object.entries(totals.assetsByCategory).forEach(([category, value]) => {
                if (value > 0) {
                    const percentage = grandTotal > 0 ? ((value / grandTotal) * 100).toFixed(1) : 0;
                    addTableRow(tbody, category, value, percentage, true);
                }
            });

            // Add separator
            const separatorRow = tbody.insertRow();
            separatorRow.innerHTML = '<td colspan="3" style="border-bottom: 2px solid var(--border-color)"></td>';

            // Add liabilities
            Object.entries(totals.liabilitiesByCategory).forEach(([category, value]) => {
                if (value > 0) {
                    const percentage = grandTotal > 0 ? ((value / grandTotal) * 100).toFixed(1) : 0;
                    addTableRow(tbody, category, value, percentage, false);
                }
            });
        }

        // Helper function to add table rows
        function addTableRow(tbody, category, value, percentage, isAsset) {
            const row = tbody.insertRow();
            row.innerHTML = `
        <td>${category}</td>
        <td class="amount-cell ${isAsset ? 'positive' : 'negative'}">
            ${formatCurrency(value)}
        </td>
        <td class="amount-cell">${percentage}%</td>
    `;
        }

        // Calculate and update everything
        function calculateAndUpdate() {
            const totals = calculateTotals();
            updateResults(totals);
            updateAssetDistributionChart(totals);
            updateNetWorthTrendChart(totals);
            updateBreakdownTable(totals);
        }

        // Handle window resize
        function handleResize() {
            clearTimeout(calculationTimeout);
            calculationTimeout = setTimeout(calculateAndUpdate, 300);
        }

        // Initialize event listeners
        function initializeInputListeners() {
            document.querySelectorAll('.input-field').forEach(input => {
                input.addEventListener('input', () => {
                    if (input.value < 0) input.value = 0; // Ensure non-negative values
                    clearTimeout(calculationTimeout);
                    calculationTimeout = setTimeout(calculateAndUpdate, 300);
                });
            });

            window.addEventListener('resize', handleResize);
        }

        // Initialize calculator
        function initialize() {
            initializeInputListeners();
            calculateAndUpdate(); // Initial calculation on load
        }

        // Start the calculator
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>

</html>
