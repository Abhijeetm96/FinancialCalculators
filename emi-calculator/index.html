<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .tenure-group {
            display: flex;
            gap: 10px;
        }
        .tenure-group input {
            flex-grow: 1;
        }
        .tenure-group select {
            width: auto; /* Adjust width or use flex-basis */
            flex-grow: 0.5;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            color: #333;
        }
        #result p {
            margin: 0;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EMI Calculator</h1>

        <div class="input-group">
            <label for="loanAmount">Loan Amount (P)</label>
            <input type="number" id="loanAmount" placeholder="Enter loan amount">
            <div class="error" id="loanAmountError"></div>
        </div>

        <div class="input-group">
            <label for="interestRate">Annual Interest Rate (%)</label>
            <input type="number" id="interestRate" placeholder="Enter annual interest rate">
            <div class="error" id="interestRateError"></div>
        </div>

        <div class="input-group">
            <label for="loanTenure">Loan Tenure</label>
            <div class="tenure-group">
                <input type="number" id="loanTenure" placeholder="Enter tenure value">
                <select id="tenureType">
                    <option value="years">Years</option>
                    <option value="months">Months</option>
                </select>
            </div>
            <div class="error" id="loanTenureError"></div>
        </div>

        <button onclick="calculateEMI()">Calculate EMI</button>

        <div id="result" style="display: none;">
            <p>Your Monthly EMI is: <strong id="emiValue"></strong></p>
        </div>
    </div>

    <script>
        function validateInput(value, fieldName, errorElementId) {
            const errorElement = document.getElementById(errorElementId);
            if (isNaN(value) || value <= 0) {
                errorElement.textContent = fieldName + ' must be a positive number.';
                return false;
            }
            errorElement.textContent = '';
            return true;
        }

        function calculateEMI() {
            const loanAmountInput = document.getElementById('loanAmount');
            const interestRateInput = document.getElementById('interestRate');
            const loanTenureInput = document.getElementById('loanTenure');
            const tenureTypeInput = document.getElementById('tenureType');
            const resultDiv = document.getElementById('result');
            const emiValueSpan = document.getElementById('emiValue');

            // Clear previous errors
            document.getElementById('loanAmountError').textContent = '';
            document.getElementById('interestRateError').textContent = '';
            document.getElementById('loanTenureError').textContent = '';

            const P = parseFloat(loanAmountInput.value);
            const annualRate = parseFloat(interestRateInput.value);
            const tenureValue = parseFloat(loanTenureInput.value);
            const tenureType = tenureTypeInput.value;

            let isValid = true;
            isValid &= validateInput(P, 'Loan Amount', 'loanAmountError');
            isValid &= validateInput(annualRate, 'Interest Rate', 'interestRateError');
            isValid &= validateInput(tenureValue, 'Loan Tenure', 'loanTenureError');

            if (!isValid) {
                resultDiv.style.display = 'none';
                return;
            }

            const r = annualRate / 12 / 100; // Monthly interest rate
            let n; // Loan tenure in months

            if (tenureType === 'years') {
                n = tenureValue * 12;
            } else {
                n = tenureValue;
            }

            if (r === 0) { // Handle zero interest rate case
                emiValueSpan.textContent = (P / n).toFixed(2);
                resultDiv.style.display = 'block';
                return;
            }

            const emi = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);

            if (isNaN(emi) || !isFinite(emi)) {
                emiValueSpan.textContent = 'N/A (Please check inputs)';
            } else {
                emiValueSpan.textContent = '₹ ' + emi.toFixed(2);
            }
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
